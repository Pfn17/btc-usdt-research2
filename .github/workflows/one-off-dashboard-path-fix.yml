name: one-off-dashboard-path-fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace owner-facing path label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard/index.html')
          s=p.read_text()
          old='<div class="flow-node"><strong>Owner view</strong><span>READ-ONLY PRESENTATION</span></div>'
          new='<div class="flow-node"><strong>Research archive</strong><span>READ-ONLY PRESENTATION</span></div>'
          if old not in s: raise SystemExit('expected evidence-path label not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html
          git commit -m 'fix: use research archive evidence path label'
          rm .github/workflows/one-off-dashboard-path-fix.yml
          git add .github/workflows/one-off-dashboard-path-fix.yml
          git commit -m 'chore: remove one-off dashboard path workflow'
          git push
