name: one-off-dashboard-professional-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'chore: remove one-off dashboard fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded dashboard/API/documentation fixes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('dashboard/index.html')
          s = dashboard.read_text()

          replacements = {
            'font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif': 'font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,ui-sans-serif,system-ui,sans-serif',
            'OWNER VIEW': 'READ-ONLY',
            'No validated edge.': 'No validated edge',
            'Frozen results, current observations, and system state from the read-only archive.': 'Frozen research results, current market observations, and system status from the read-only archive.',
            'A result is not promoted to an edge unless its evidence clears the research gate.': 'An edge is not promoted unless the frozen evidence clears the research gate.',
            'The dashboard reports system results. It does not perform trading actions.': 'Read-only archive. Trading remains disabled.',
            'The tested funding family did not clear its cost-adjusted research gate.': 'The tested funding family did not clear the cost-adjusted gate.',
            'The frozen swing results remain compatible with both loss and gain.': 'The frozen swing results do not exclude zero at the stated confidence level.',
            'Reference lineage · Claude': 'Reference lineage',
            'Independent lineage · Manus': 'Independent lineage',
            'Market observations → Collection → Research record → Owner view': 'Market observations → Collection → Research record → Research archive',
            'Owner-governed research archive · separate execution boundary': 'Read-only research archive · Execution off · No validated edge',
            'Live research data loaded.': 'Research data updated.',
            'Updated from the read-only backend.': 'Updated from the read-only backend.',
            'Some current data could not be retrieved. Affected sections are marked unavailable.': 'Some data could not be retrieved. Affected fields are marked unavailable.',
            'Some current data could not be retrieved. Affected sections are marked unavailable.': 'Some data could not be retrieved. Affected fields are marked unavailable.',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          s = s.replace('font-size:clamp(50px,11vw,96px);line-height:.9;letter-spacing:-.07em', 'font-size:clamp(44px,8vw,76px);line-height:.98;letter-spacing:-.05em')
          s = s.replace('padding:68px 0;border-bottom', 'padding:58px 0;border-bottom')
          s = s.replace('padding:78px 0 54px', 'padding:62px 0 48px')
          s = s.replace('font-size:15px;line-height:1.7;margin:22px 0 0', 'font-size:15px;line-height:1.65;margin:18px 0 0')
          s = s.replace('font-size:11px;line-height:1.6}.hero-card', 'font-size:12px;line-height:1.55}.hero-card')
          s = s.replace('font:750 25px var(--mono)', 'font:700 22px var(--mono)')
          s = s.replace('font-size:17px;font-weight:800', 'font-size:16px;font-weight:700')
          s = s.replace('border-radius:12px;padding:22px', 'border-radius:12px;padding:20px')

          old = "function researchDecision(p){const x=row(p);if(!x)return 'UNAVAILABLE';const net=Number(x.mean_net_bps),lo=Number(x.net_ci95_low),hi=Number(x.net_ci95_high);if(!Number.isFinite(net)||!Number.isFinite(lo)||!Number.isFinite(hi))return 'UNAVAILABLE';if(net<=0)return 'KILLED · NET EV ≤ 0';if(lo<=0&&hi>=0)return 'INCONCLUSIVE · NOT PROMOTED';return 'PROMOTABLE GATE · REVIEW REQUIRED'}"
          new = "function researchDecision(p){const x=row(p);if(!x)return 'UNAVAILABLE';const net=Number(x.mean_net_bps),lo=Number(x.net_ci95_low),hi=Number(x.net_ci95_high);if(!Number.isFinite(net)||!Number.isFinite(lo)||!Number.isFinite(hi))return 'UNAVAILABLE';if(net<=0)return 'KILLED · NET EV ≤ 0';if(lo<=0&&hi>=0)return 'INCONCLUSIVE · NOT PROMOTED';return 'PROMOTABLE GATE · REVIEW REQUIRED'}\nfunction hfb1Decision(p){return p?.research_status||'UNAVAILABLE'}"
          if old not in s: raise SystemExit('expected frontend researchDecision function not found')
          s = s.replace(old,new)
          s = s.replace("set(prefix+'Decision',researchDecision(p))", "set(prefix+'Decision',prefix==='hfb'?hfb1Decision(p):researchDecision(p))")
          s = s.replace("set('hfbStatus',readableStatus(a))", "set('hfbStatus',hfb1Decision(a))")

          dashboard.write_text(s)

          api = Path('src/btc_research/api.py')
          a = api.read_text()
          marker = '\ndef freshness(row:dict[str,Any]|None)->dict[str,Any]:'
          helper = '''\ndef hfb1_research_status(rows:list[dict[str,Any]])->str:\n    """Return the frozen H-FB1 research gate from backend data.\n\n    The dashboard consumes this field as authoritative presentation state;\n    it does not recompute the decision client-side.\n    """\n    row=next((r for r in rows if str(r.get("bucket", "")).lower()=="overall"), None) or (rows[0] if rows else None)\n    if not row:return "UNAVAILABLE"\n    try:\n        net=float(row["mean_net_bps"]); lo=float(row["net_ci95_low"]); hi=float(row["net_ci95_high"])\n    except (KeyError,TypeError,ValueError):\n        return "UNAVAILABLE"\n    if net<=0:return "KILLED · NET EV ≤ 0"\n    if lo<=0<=hi:return "INCONCLUSIVE · NOT PROMOTED"\n    return "PROMOTION ELIGIBLE · REVIEW REQUIRED"\n'''
          if marker not in a: raise SystemExit('expected api freshness marker not found')
          a = a.replace(marker, helper + marker, 1)
          old_return = 'return {"status":"RESEARCH_ONLY","data":rows,"parameters":{"oos_start_ms":start,"as_of_event_time_ms":as_of,"fee_bps_per_side":fee_bps,"slippage_bps_per_side":slippage_bps,"horizon_minutes":240},"trading_enabled":False}'
          new_return = 'return {"status":"RESEARCH_ONLY","research_status":hfb1_research_status(rows),"decision_source":"backend","data":rows,"parameters":{"oos_start_ms":start,"as_of_event_time_ms":as_of,"fee_bps_per_side":fee_bps,"slippage_bps_per_side":slippage_bps,"horizon_minutes":240},"trading_enabled":False}'
          if old_return not in a: raise SystemExit('expected hfb1 return not found')
          a = a.replace(old_return,new_return,1)
          api.write_text(a)

          doc = Path('docs/DASHBOARD_MODES.md')
          d = doc.read_text()
          d = d.replace('H-FB1, H-SW1 reference/Claude, H-SW1 independent/Manus', 'H-FB1, H-SW1 reference, H-SW1 independent')
          d = d.replace('The evidence path uses neutral terms: **Market observations → Collection → Research record → Research archive**. It does not claim a vendor, host, database, API path, or RPC name. H-SW1 lineage names are shown only where needed to distinguish the two materially different frozen methods.', 'The evidence path uses neutral terms: **Market observations → Collection → Research record → Research archive**. It does not claim a vendor, host, database, API path, or RPC name. H-SW1 lineage labels remain neutral because the two frozen methods must stay distinct without exposing internal agent names.')
          d = d.replace('Wider grids are introduced only at `min-width: 768px`.', 'Wider grids are introduced only at `min-width: 700px`.')
          doc.write_text(d)
          PY

      - name: Validate bounded changes
        run: |
          python3 -m py_compile src/btc_research/api.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dashboard/index.html').read_text()
          assert 'OWNER VIEW' not in s
          assert 'Reference lineage · Claude' not in s
          assert 'Independent lineage · Manus' not in s
          assert 'Owner view' not in s
          assert 'function hfb1Decision' in s
          a=Path('src/btc_research/api.py').read_text()
          assert 'hfb1_research_status' in a
          assert '"decision_source":"backend"' in a
          print('bounded dashboard/API validation passed')
          PY
          git diff --check

      - name: Commit and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/index.html src/btc_research/api.py docs/DASHBOARD_MODES.md
          git commit -m 'fix: professionalize research dashboard and backend hfb1 status'
          rm -f .github/workflows/one-off-dashboard-professional-fix.yml
          git add .github/workflows/one-off-dashboard-professional-fix.yml
          git commit -m 'chore: remove one-off dashboard fix workflow'
          git push
